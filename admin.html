<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTELLEXA '26 – Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f3260; --navy2: #1a4f8a; --blue: #3b82c4; --glow: #38bdf8;
      --bg: #ddeeff; --white: #fff; --text: #0d2a4a; --muted: #5b7fa6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      border-bottom: 3px solid var(--glow);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; letter-spacing: 2px; }
    .logout-btn { background: none; border: 1px solid var(--glow); color: var(--glow); padding: 5px 15px; border-radius: 5px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 700; transition: 0.3s; }
    .logout-btn:hover { background: var(--glow); color: var(--navy); }

    /* Login Overlay */
    #login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-box { background: #fff; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .login-box h2 { text-align: center; margin-bottom: 25px; font-family: 'Orbitron', sans-serif; color: var(--navy); font-size: 1.1rem; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    .login-box button { width: 100%; padding: 12px; background: var(--navy); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

    /* Main Grid */
    .container { padding: 30px; max-width: 1400px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stat-val { font-size: 2rem; font-weight: 800; color: var(--navy); display: block; }
    .stat-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .filters { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .filters input, .filters select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; flex: 1; min-width: 200px; }
    .filters button { padding: 10px 25px; background: var(--navy); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

    .table-wrap { background: #fff; border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th { background: #f8fafc; padding: 15px; text-align: left; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #eee; }
    td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; vertical-align: middle; }
    tr:hover { background: #f9fbff; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .pending { background: #fef3c7; color: #92400e; }
    .confirmed { background: #dcfce7; color: #166534; }
    .rejected { background: #fee2e2; color: #991b1b; }

    .action-select { padding: 5px; border-radius: 5px; border: 1px solid #ddd; font-size: 0.8rem; }
    .view-btn { color: var(--blue); text-decoration: none; font-weight: 600; }
    
    #loading { text-align: center; padding: 50px; display: none; }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h2>ADMIN ACCESS</h2>
    <div id="login-error" style="color:red; margin-bottom:10px; font-size:0.8rem; display:none;">Invalid credentials</div>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
  </div>
</div>

<header>
  <h1>INTELLEXA '26 — ADMIN</h1>
  <button class="logout-btn" onclick="logout()">LOGOUT</button>
</header>

<main class="container">
  <div class="stats-grid">
    <div class="stat-card"><span class="stat-val" id="stat-total">0</span><span class="stat-label">Total</span></div>
    <div class="stat-card"><span class="stat-val" id="stat-confirmed" style="color:#16a34a">0</span><span class="stat-label">Confirmed</span></div>
    <div class="stat-card"><span class="stat-val" id="stat-pending" style="color:#d97706">0</span><span class="stat-label">Pending</span></div>
    <div class="stat-card"><span class="stat-val" id="stat-rejected" style="color:#dc2626">0</span><span class="stat-label">Rejected</span></div>
  </div>

  <div class="filters">
    <input type="text" id="search" placeholder="Search name / email / college..." oninput="fetchData()">
    <select id="status-filter" onchange="fetchData()">
      <option value="all">All Status</option>
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="rejected">Rejected</option>
    </select>
    <button onclick="fetchData()">RELOAD</button>
  </div>

  <div id="loading">Loading registrations...</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name / Info</th>
          <th>College / Dept</th>
          <th>Events</th>
          <th>Payment / Screenshot</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="reg-table-body">
        <!-- Rows will be injected here -->
      </tbody>
    </table>
  </div>
</main>

<script>
  const API_BASE = '/api/admin';
  let isLoggedIn = localStorage.getItem('admin_logged_in') === 'true';

  if (isLoggedIn) {
     document.getElementById('login-overlay').style.display = 'none';
     fetchData();
  }

  async function login() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('admin_logged_in', 'true');
        location.reload();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    } catch (e) { alert('Server error: ' + e.message); }
  }

  function logout() {
    localStorage.removeItem('admin_logged_in');
    location.reload();
  }

  async function fetchData() {
    const status = document.getElementById('status-filter').value;
    const search = document.getElementById('search').value;
    
    document.getElementById('loading').style.display = 'block';
    
    try {
      // Fetch Stats
      const statRes = await fetch(`${API_BASE}/stats`);
      const statData = await statRes.json();
      if (statData.success) {
        document.getElementById('stat-total').innerText = statData.stats.total;
        document.getElementById('stat-confirmed').innerText = statData.stats.confirmed;
        document.getElementById('stat-pending').innerText = statData.stats.pending;
        document.getElementById('stat-rejected').innerText = statData.stats.rejected;
      }

      // Fetch Rows
      const bodyRes = await fetch(`${API_BASE}/registrations?status=${status}&search=${search}`);
      const bodyData = await bodyRes.json();
      
      const tbody = document.getElementById('reg-table-body');
      tbody.innerHTML = '';
      
      bodyData.registrations.forEach(reg => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <strong>${reg.fullName}</strong><br>
            <small style="color:var(--muted)">${reg.email} | ${reg.phone}</small><br>
            <small>${reg.yearOfStudy} | ${reg.degree}</small>
          </td>
          <td>
            <strong>${reg.collegeName}</strong><br>
            <small>${reg.department}</small>
          </td>
          <td>
             ${reg.events.map(e => `<div style="font-size:0.7rem; background:#eff6ff; padding:2px 5px; margin:2px 0; border-radius:3px;">${e}</div>`).join('')}
             ${reg.isPaper ? `<div style="font-size:0.7rem; background:#fff1f2; padding:2px 5px; margin:2px 0; border-radius:3px; border:1px solid #fecdd3">Team: ${reg.paperSubmission.teamName}</div>` : ''}
          </td>
          <td>
            <small>ID: ${reg.transactionId}</small><br>
            <a href="/${reg.screenshotPath}" target="_blank" class="view-btn">View Screenshot →</a>
          </td>
          <td><span class="badge ${reg.status}">${reg.status}</span></td>
          <td>
            <select class="action-select" onchange="updateStatus('${reg._id}', this.value)">
              <option value="pending" ${reg.status === 'pending' ? 'selected' : ''}>Pending</option>
              <option value="confirmed" ${reg.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
              <option value="rejected" ${reg.status === 'rejected' ? 'selected' : ''}>Rejected</option>
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });
      
    } catch (e) {
      console.error(e);
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  async function updateStatus(id, newStatus) {
    try {
      const res = await fetch(`${API_BASE}/registrations/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      const data = await res.json();
      if (data.success) {
        fetchData(); // Refresh list and stats
      }
    } catch (e) { alert('Update failed: ' + e.message); }
  }
</script>

</body>
</html>
