<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INTELLEXA '26 – Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --navy: #0f3260; --navy2: #1a4f8a; --blue: #3b82c4; --glow: #38bdf8;
      --bg: #ddeeff; --white: #fff; --text: #0d2a4a; --muted: #5b7fa6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    
    header {
      background: linear-gradient(135deg, var(--navy), var(--navy2));
      border-bottom: 3px solid var(--glow);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }
    header h1 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; letter-spacing: 2px; }
    .logout-btn { background: none; border: 1px solid var(--glow); color: var(--glow); padding: 5px 15px; border-radius: 5px; cursor: pointer; font-family: 'Rajdhani', sans-serif; font-weight: 700; transition: 0.3s; }
    .logout-btn:hover { background: var(--glow); color: var(--navy); }

    /* Login Overlay */
    #login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-box { background: #fff; padding: 40px; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
    .login-box h2 { text-align: center; margin-bottom: 25px; font-family: 'Orbitron', sans-serif; color: var(--navy); font-size: 1.1rem; }
    .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; outline: none; }
    .login-box button { width: 100%; padding: 12px; background: var(--navy); color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; }

    /* Main Grid */
    .container { padding: 30px; max-width: 1400px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #fff; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .stat-val { font-size: 2rem; font-weight: 800; color: var(--navy); display: block; }
    .stat-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

    .filters { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .filters input, .filters select { padding: 10px; border: 1px solid #ddd; border-radius: 8px; outline: none; flex: 1; min-width: 200px; }
    .filters button { padding: 10px 25px; background: var(--navy); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }

    .table-wrap { background: #fff; border-radius: 12px; overflow-x: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    table { width: 100%; border-collapse: collapse; min-width: 1000px; }
    th { background: #f8fafc; padding: 15px; text-align: left; font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #eee; }
    td { padding: 15px; border-bottom: 1px solid #eee; font-size: 0.9rem; vertical-align: middle; }
    tr:hover { background: #f9fbff; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .pending { background: #fef3c7; color: #92400e; }
    .confirmed { background: #dcfce7; color: #166534; }
    .rejected { background: #fee2e2; color: #991b1b; }

    .action-select { padding: 5px; border-radius: 5px; border: 1px solid #ddd; font-size: 0.8rem; }
    .view-btn { color: var(--blue); text-decoration: none; font-weight: 600; }
    
    #loading { text-align: center; padding: 50px; display: none; }
  </style>
</head>
<body>

<div id="login-overlay">
  <div class="login-box">
    <h2>ADMIN ACCESS</h2>
    <div id="login-error" style="color:red; margin-bottom:10px; font-size:0.8rem; display:none;">Invalid credentials</div>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">LOGIN</button>
  </div>
</div>

<header>
  <h1>INTELLEXA '26 — ADMIN</h1>
  <button class="logout-btn" onclick="logout()">LOGOUT</button>
</header>

<main class="container">
  <div class="stats-grid">
    <div class="stat-card"><span class="stat-val" id="stat-total">0</span><span class="stat-label">Total</span></div>
    <div class="stat-card"><span class="stat-val" id="stat-confirmed" style="color:#16a34a">0</span><span class="stat-label">Confirmed</span></div>
    <div class="stat-card"><span class="stat-val" id="stat-pending" style="color:#d97706">0</span><span class="stat-label">Pending</span></div>
    <div class="stat-card"><span class="stat-val" id="stat-rejected" style="color:#dc2626">0</span><span class="stat-label">Rejected</span></div>
    <div class="stat-card" style="background: var(--navy); color: #fff;"><span class="stat-val" id="stat-filtered" style="color:var(--glow)">0</span><span class="stat-label" style="color: rgba(255,255,255,0.7)">Filtered Count</span></div>
  </div>

  <div class="filters">
    <input type="text" id="search" placeholder="Search name / email / college..." oninput="applyFilters()">
    <select id="status-filter" onchange="applyFilters()">
      <option value="all">All Status</option>
      <option value="pending">Pending</option>
      <option value="confirmed">Confirmed</option>
      <option value="rejected">Rejected</option>
    </select>
    <select id="event-filter" onchange="applyFilters()">
      <option value="all">All Events</option>
      <optgroup label="Workshop">
        <option value="NEXA AI Workshop">🤖 NEXA AI Workshop</option>
      </optgroup>
      <optgroup label="Technical">
        <option value="AI Prompt Arena">💡 AI Prompt Arena</option>
        <option value="Paper Presentation">📄 Paper Presentation</option>
        <option value="Web Design Clash">🌐 Web Design Clash</option>
        <option value="Code Relay">⚙️ Code Relay</option>
      </optgroup>
      <optgroup label="Non-Technical">
        <option value="IPL Auction">🏏 IPL Auction</option>
        <option value="Photography Contest">📸 Photography Contest</option>
        <option value="Brain Blitz Quiz">🧠 Brain Blitz Quiz</option>
        <option value="MindLink Challenge">🔗 MindLink Challenge</option>
      </optgroup>
    </select>
    <select id="college-type-filter" onchange="applyFilters()">
      <option value="all">All Colleges</option>
      <option value="internal">Internal (Ramco Institute of Technology)</option>
      <option value="external">External Colleges</option>
    </select>
    <button onclick="fetchData()">RELOAD</button>
    <button onclick="exportToExcel()" style="background: #16a34a; display: flex; align-items: center; gap: 8px;">
      <i class="fas fa-file-excel"></i> DOWNLOAD EXCEL
    </button>
    <button onclick="exportPaperTeams()" style="background: #9f1239; display: flex; align-items: center; gap: 8px;">
      <i class="fas fa-file-download"></i> PAPER TEAMS
    </button>
    <button onclick="toggleTeamStats()" style="background: #6366f1; display: flex; align-items: center; gap: 8px;">
      <i class="fas fa-users"></i> TEAM STATS
    </button>
  </div>

  <div id="team-stats-container" style="display: none; background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
    <h3 style="font-family: 'Orbitron', sans-serif; font-size: 1rem; margin-bottom: 15px; color: var(--navy);">Team Participation Summary</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
      <div>
        <h4 style="font-size: 0.85rem; color: #9f1239; margin-bottom: 10px;">📄 Paper Presentation Teams (<span id="paper-team-count">0</span>)</h4>
        <div id="paper-teams-list" style="font-size: 0.8rem; max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 5px;"></div>
      </div>
      <div>
        <h4 style="font-size: 0.85rem; color: #166534; margin-bottom: 10px;">🏏 IPL Auction Teams (<span id="ipl-team-count">0</span>)</h4>
        <div id="ipl-teams-list" style="font-size: 0.8rem; max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px; border-radius: 5px;"></div>
      </div>
    </div>
  </div>

  <div id="loading">Loading registrations...</div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name / Info</th>
          <th>College / Dept</th>
          <th>Events</th>
          <th>Payment / Screenshot</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="reg-table-body">
        <!-- Rows will be injected here -->
      </tbody>
    </table>
  </div>
</main>

<script>
  const API_BASE = '/api/admin';
  let isLoggedIn = localStorage.getItem('admin_logged_in') === 'true';
  let allRegistrations = [];
  let filteredRegistrations = [];

  if (isLoggedIn) {
     document.getElementById('login-overlay').style.display = 'none';
     fetchData();
  }

  async function login() {
    const u = document.getElementById('username').value;
    const p = document.getElementById('password').value;
    try {
      const res = await fetch(`${API_BASE}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('admin_logged_in', 'true');
        location.reload();
      } else {
        document.getElementById('login-error').style.display = 'block';
      }
    } catch (e) { alert('Server error: ' + e.message); }
  }

  function logout() {
    localStorage.removeItem('admin_logged_in');
    location.reload();
  }

  async function fetchData() {
    document.getElementById('loading').style.display = 'block';
    try {
      // Fetch Stats
      const statRes = await fetch(`${API_BASE}/stats`);
      const statData = await statRes.json();
      if (statData.success) {
        document.getElementById('stat-total').innerText = statData.stats.total;
        document.getElementById('stat-confirmed').innerText = statData.stats.confirmed;
        document.getElementById('stat-pending').innerText = statData.stats.pending;
        document.getElementById('stat-rejected').innerText = statData.stats.rejected;
      }

      // Fetch All Rows (unfiltered from server to allow advanced client-side filtering)
      const bodyRes = await fetch(`${API_BASE}/registrations?status=all`);
      const bodyData = await bodyRes.json();
      
      if (bodyData.success) {
        allRegistrations = bodyData.registrations;
        applyFilters(); 
      }
      
    } catch (e) {
      console.error(e);
      alert('Error fetching data: ' + e.message);
    } finally {
      document.getElementById('loading').style.display = 'none';
    }
  }

  function applyFilters() {
    const search = document.getElementById('search').value.toLowerCase();
    const status = document.getElementById('status-filter').value;
    const event = document.getElementById('event-filter').value;
    const collegeType = document.getElementById('college-type-filter').value;

    filteredRegistrations = allRegistrations.filter(reg => {
      // Search
      const matchesSearch = !search || 
        reg.fullName.toLowerCase().includes(search) || 
        reg.email.toLowerCase().includes(search) || 
        reg.collegeName.toLowerCase().includes(search) ||
        reg.registrationId.toLowerCase().includes(search);

      // Status
      const matchesStatus = status === 'all' || reg.status === status;

      // Event
      const matchesEvent = event === 'all' || reg.events.includes(event);

      // College Type
      const isInternal = reg.collegeName.toLowerCase().includes('ramco institute of technology');
      const matchesCollege = collegeType === 'all' || 
                             (collegeType === 'internal' && isInternal) ||
                             (collegeType === 'external' && !isInternal);

      return matchesSearch && matchesStatus && matchesEvent && matchesCollege;
    });

    renderTable();
    document.getElementById('stat-filtered').innerText = filteredRegistrations.length;
  }

  function renderTable() {
    const tbody = document.getElementById('reg-table-body');
    tbody.innerHTML = '';
    
    filteredRegistrations.forEach(reg => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>
          <strong>${reg.fullName}</strong><br>
          <small style="color:var(--muted)">${reg.registrationId} | ${reg.email}</small><br>
          <small>${reg.yearOfStudy} | ${reg.phone}</small>
        </td>
        <td>
          <strong>${reg.collegeName}</strong><br>
          <small>${reg.department}</small>
        </td>
        <td>
           <div style="display:flex; flex-wrap:wrap; gap:4px;">
             ${reg.events.map(e => `<span style="font-size:0.7rem; background:#eff6ff; padding:2px 6px; border-radius:3px; border:1px solid #dbeafe;">${e}</span>`).join('')}
           </div>
           ${(reg.isPaper && reg.paperSubmission) ? `
             <div style="margin-top:8px; font-size:0.75rem; background:#fff1f2; padding:6px; border-radius:5px; border:1px solid #fecdd3">
               <strong style="color:#9f1239">📄 Paper Presentation</strong><br>
               <strong>Team:</strong> ${reg.paperSubmission.teamName || 'N/A'} (${reg.paperSubmission.memberCount || 0})<br>
               <strong>Title:</strong> ${reg.paperSubmission.paperTitle || 'N/A'}
             </div>` : ''}
           ${(reg.isIpl && reg.iplSubmission) ? `
             <div style="margin-top:8px; font-size:0.75rem; background:#f0fdf4; padding:6px; border-radius:5px; border:1px solid #dcfce7">
               <strong style="color:#166534">🏏 IPL Auction</strong><br>
               <strong>Team:</strong> ${reg.iplSubmission.teamName || 'N/A'}
             </div>` : ''}
        </td>
        <td>
          <small>TXN: ${reg.transactionId}</small><br>
          <a href="${reg.screenshotPath.startsWith('http') ? reg.screenshotPath : '/' + reg.screenshotPath}" target="_blank" class="view-btn">View Receipt →</a>
        </td>
        <td><span class="badge ${reg.status}">${reg.status}</span></td>
        <td>
          <select class="action-select" onchange="updateStatus('${reg._id}', this.value)">
            <option value="pending" ${reg.status === 'pending' ? 'selected' : ''}>Pending</option>
            <option value="confirmed" ${reg.status === 'confirmed' ? 'selected' : ''}>Confirmed</option>
            <option value="rejected" ${reg.status === 'rejected' ? 'selected' : ''}>Rejected</option>
          </select>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  async function updateStatus(id, newStatus) {
    try {
      const res = await fetch(`${API_BASE}/registrations/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      const data = await res.json();
      if (data.success) {
        // Update local data to reflect change without full reload
        const idx = allRegistrations.findIndex(r => r._id === id);
        if (idx !== -1) allRegistrations[idx].status = newStatus;
        applyFilters(); 
        
        // Refresh stats
        const statRes = await fetch(`${API_BASE}/stats`);
        const statData = await statRes.json();
        if (statData.success) {
          document.getElementById('stat-total').innerText = statData.stats.total;
          document.getElementById('stat-confirmed').innerText = statData.stats.confirmed;
          document.getElementById('stat-pending').innerText = statData.stats.pending;
          document.getElementById('stat-rejected').innerText = statData.stats.rejected;
        }
      }
    } catch (e) { alert('Update failed: ' + e.message); }
  }

  function exportToExcel() {
    if (filteredRegistrations.length === 0) {
      alert('No records to export');
      return;
    }

    const exportData = filteredRegistrations.map(reg => {
      const isInternal = reg.collegeName.toLowerCase().includes('ramco institute of technology');
      
      const baseData = {
        'Reg ID': reg.registrationId,
        'Full Name': reg.fullName,
        'Email': reg.email,
        'Phone': reg.phone,
        'College': reg.collegeName,
        'College Type': isInternal ? 'Internal' : 'External',
        'Department': reg.department,
        'Year': reg.yearOfStudy,
        'Degree': reg.degree,
        'Status': reg.status.toUpperCase(),
        'Events': reg.events.join(', '),
        'Transaction ID': reg.transactionId,
        'Registered At': new Date(reg.registeredAt).toLocaleString()
      };

      // Add Paper Presentation specific data
      if (reg.isPaper && reg.paperSubmission) {
        baseData['Paper: Team Name'] = reg.paperSubmission.teamName || '';
        baseData['Paper: Member Count'] = reg.paperSubmission.memberCount || 0;
        baseData['Paper: Member Names'] = (reg.paperSubmission.memberNames || []).join(', ');
        baseData['Paper: Title'] = reg.paperSubmission.paperTitle || '';
        baseData['Paper: Abstract'] = reg.paperSubmission.abstractText || '';
      }

      // Add IPL Auction specific data
      if (reg.isIpl && reg.iplSubmission) {
        baseData['IPL: Team Name'] = reg.iplSubmission.teamName || '';
        baseData['IPL: Member Names'] = (reg.iplSubmission.memberNames || []).join(', ');
      }

      return baseData;
    });

    const worksheet = XLSX.utils.json_to_sheet(exportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Registrations");
    
    // Auto-size columns
    const maxWidths = {};
    exportData.forEach(row => {
      Object.keys(row).forEach(key => {
        const val = String(row[key] || '');
        maxWidths[key] = Math.max(maxWidths[key] || 10, val.length, key.length);
      });
    });
    worksheet['!cols'] = Object.keys(maxWidths).map(key => ({ wch: maxWidths[key] + 2 }));

    const fileName = `Intellexa_Registrations_${new Date().toISOString().split('T')[0]}.xlsx`;
    XLSX.writeFile(workbook, fileName);
  }

  function exportPaperTeams() {
    // Filter allRegistrations for Paper Presentation
    const paperRegs = allRegistrations.filter(reg => reg.isPaper && reg.paperSubmission);

    if (paperRegs.length === 0) {
      alert('No Paper Presentation records found');
      return;
    }

    // Apply current status and college filters from the UI
    const status = document.getElementById('status-filter').value;
    const collegeType = document.getElementById('college-type-filter').value;
    const search = document.getElementById('search').value.toLowerCase();

    const filtered = paperRegs.filter(reg => {
      const matchesStatus = status === 'all' || reg.status === status;
      const isInternal = reg.collegeName.toLowerCase().includes('ramco institute of technology');
      const matchesCollege = collegeType === 'all' || 
                             (collegeType === 'internal' && isInternal) ||
                             (collegeType === 'external' && !isInternal);
      const matchesSearch = !search || 
        reg.fullName.toLowerCase().includes(search) || 
        reg.email.toLowerCase().includes(search) || 
        reg.collegeName.toLowerCase().includes(search) ||
        reg.registrationId.toLowerCase().includes(search);
      
      return matchesStatus && matchesCollege && matchesSearch;
    });

    if (filtered.length === 0) {
      alert('No Paper Presentation records match the current filters');
      return;
    }

    // Consolidate by Unique Team Name (Case-Insensitive)
    const uniqueTeams = new Map();
    filtered.forEach(reg => {
      const teamName = reg.paperSubmission.teamName || 'N/A';
      const key = teamName.toLowerCase().trim();
      
      if (!uniqueTeams.has(key)) {
        uniqueTeams.set(key, {
          'Team Name': teamName,
          'Team Members': (reg.paperSubmission.memberNames || []).join(', '),
          'Abstract Title': reg.paperSubmission.paperTitle || 'N/A',
          'Abstract': reg.paperSubmission.abstractText || 'N/A',
          'College': reg.collegeName,
          'Department': reg.department
        });
      }
    });

    const exportData = Array.from(uniqueTeams.values());

    const worksheet = XLSX.utils.json_to_sheet(exportData);
    const workbook = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(workbook, worksheet, "Paper Teams");
    
    // Auto-size columns
    const maxWidths = {};
    if (exportData.length > 0) {
      Object.keys(exportData[0]).forEach(key => {
        maxWidths[key] = Math.max(10, key.length);
        exportData.forEach(row => {
          const val = String(row[key] || '');
          maxWidths[key] = Math.max(maxWidths[key], val.length);
        });
      });
      worksheet['!cols'] = Object.keys(maxWidths).map(key => ({ wch: Math.min(maxWidths[key] + 2, 50) })); // Cap width for readability
    }

    const fileName = `Intellexa_Paper_Teams_${new Date().toISOString().split('T')[0]}.xlsx`;
    XLSX.writeFile(workbook, fileName);
  }

  function toggleTeamStats() {
    const container = document.getElementById('team-stats-container');
    if (container.style.display === 'none') {
      calculateTeamCounts();
      container.style.display = 'block';
    } else {
      container.style.display = 'none';
    }
  }

  function calculateTeamCounts() {
    const paperTeams = {};
    const iplTeams = {};
    
    // Create a Set of all registered names (normalized) for quick lookup
    const registeredNames = new Set(allRegistrations.map(r => r.fullName.toLowerCase().trim().replace(/\s+/g, ' ')));

    function getMissingMembers(memberNames) {
      if (!memberNames || !Array.isArray(memberNames)) return [];
      return memberNames.filter(name => {
        const normalized = name.toLowerCase().trim().replace(/\s+/g, ' ');
        return !registeredNames.has(normalized);
      });
    }

    filteredRegistrations.forEach(reg => {
      if (reg.isPaper && reg.paperSubmission && reg.paperSubmission.teamName) {
        const name = reg.paperSubmission.teamName.toLowerCase().trim();
        if (!paperTeams[name]) {
          paperTeams[name] = { 
            count: 0, 
            missing: getMissingMembers(reg.paperSubmission.memberNames),
            allMembers: reg.paperSubmission.memberNames
          };
        }
        paperTeams[name].count++;
      }
      if (reg.isIpl && reg.iplSubmission && reg.iplSubmission.teamName) {
        const name = reg.iplSubmission.teamName.toLowerCase().trim();
        if (!iplTeams[name]) {
          iplTeams[name] = { 
            count: 0, 
            missing: getMissingMembers(reg.iplSubmission.memberNames),
            allMembers: reg.iplSubmission.memberNames
          };
        }
        iplTeams[name].count++;
      }
    });

    const paperList = document.getElementById('paper-teams-list');
    const iplList = document.getElementById('ipl-teams-list');
    
    const paperEntries = Object.entries(paperTeams).sort((a,b) => b[1].count - a[1].count);
    const iplEntries = Object.entries(iplTeams).sort((a,b) => b[1].count - a[1].count);

    document.getElementById('paper-team-count').innerText = paperEntries.length;
    document.getElementById('ipl-team-count').innerText = iplEntries.length;

    const renderTeamRow = ([name, data]) => {
      const isComplete = data.missing.length === 0;
      return `
        <div style="padding:8px 0; border-bottom:1px solid #eee">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="text-transform:capitalize">${name}</strong>
            <span style="font-size:0.75rem; color:var(--muted)">${data.allMembers.length} members</span>
          </div>
          <div style="margin-top:4px; font-size:0.7rem;">
            ${isComplete 
              ? '<span style="color:#16a34a"><i class="fas fa-check-circle"></i> All members registered</span>' 
              : `<span style="color:#dc2626"><i class="fas fa-exclamation-triangle"></i> Missing: ${data.missing.join(', ')}</span>`}
          </div>
        </div>
      `;
    };

    paperList.innerHTML = paperEntries.map(renderTeamRow).join('') || 'No teams found';
    iplList.innerHTML = iplEntries.map(renderTeamRow).join('') || 'No teams found';
  }
</script>

</body>
</html>
